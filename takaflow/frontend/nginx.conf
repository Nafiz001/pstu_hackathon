# Serves the SPA and forwards the API on the SAME ORIGIN.
#
# Same-origin matters for more than convenience: no CORS preflight on every mutation, and the
# browser's cookie and referrer rules behave in development exactly as they will in production.
resolver 127.0.0.11 valid=2s ipv6=off;

server {
    listen 80;
    # Explicit, for the same reason as the API proxy: the image's entrypoint cannot inject an
    # IPv6 listener into a read-only config, and Windows resolves `localhost` to ::1 first.
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Hashed asset filenames are immutable; index.html must never be cached or a deploy leaves
    # browsers loading a stale shell that points at assets which no longer exist.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location /api/ {
        set $upstream "proxy:80";
        proxy_pass http://$upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # The statement endpoint streams; buffering it would defeat the point.
        proxy_buffering off;
        proxy_read_timeout 120s;
    }

    location /healthz {
        set $upstream "proxy:80";
        proxy_pass http://$upstream;
        proxy_set_header Host $host;
    }

    location /metrics {
        set $upstream "proxy:80";
        proxy_pass http://$upstream;
        proxy_set_header Host $host;
    }

    # Client-side routing: any unknown path is a route, not a missing file.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
