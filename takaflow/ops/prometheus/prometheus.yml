global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: takaflow-api
    metrics_path: /metrics
    # Scrapes the API replicas directly rather than through the proxy: a per-instance view is the
    # point, and going through the load balancer would sample a random replica each time and make
    # every counter look like it was resetting.
    dns_sd_configs:
      - names: ["api"]
        type: A
        port: 3000
        refresh_interval: 10s
