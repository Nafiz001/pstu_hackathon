# Reverse proxy in front of the API replicas.
#
# Its job in this project is to prove a property, not to be a production edge: with three
# stateless replicas behind it, the idempotency layer and the outbox dispatcher have to be
# correct across *processes*, not merely across requests on one process. Every concurrency test
# can then be re-run through this port and must produce identical results.
#
# WHY THERE IS NO `upstream` BLOCK.
#
# nginx resolves the hostnames in an `upstream` block once, at configuration load, and caches the
# addresses for the lifetime of the process. In a container environment that is a trap: recreate
# the API containers and they come back with new IPs, while nginx keeps dialling the old ones and
# answers every request with a 502 — with the API perfectly healthy the whole time. It cost us a
# confusing half-hour of "chaos test failures" that were entirely the proxy's doing.
#
# Using Docker's embedded DNS (127.0.0.11) with a `resolver` directive and a *variable* in
# proxy_pass forces re-resolution on the `valid=` interval, so replicas can be replaced freely.
# Docker returns one A record per replica of the `api` service and rotates them, which gives the
# load spreading the fixed upstream list was there for.

# Short validity: this is the upper bound on how long the proxy can keep dialling a
# replica that has just been replaced. DNS-based routing has no passive health check,
# so this window is the trade for being able to replace replicas at all.
resolver 127.0.0.11 valid=2s ipv6=off;

server {
    listen 80;
    # Declared explicitly rather than left to the image's entrypoint. That entrypoint normally
    # injects an IPv6 listener, but it cannot edit a config mounted read-only — and on Windows
    # `localhost` resolves to ::1 first, so the container looked completely unreachable from the
    # host while working perfectly from inside the Docker network.
    listen [::]:80;
    server_name _;

    # A money API should never silently truncate or buffer a request body to disk.
    client_max_body_size 256k;
    proxy_request_buffering off;

    location / {
        # The variable is what makes nginx re-resolve; a literal here would be cached forever.
        set $api_backend "api:3000";
        proxy_pass http://$api_backend;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Generated here if the client did not supply one, so a single id follows the request
        # through whichever replica handles it.
        proxy_set_header X-Request-Id $request_id;

        proxy_connect_timeout 2s;
        proxy_send_timeout 20s;
        proxy_read_timeout 20s;

        # CRITICAL: never retry a non-idempotent request at the proxy layer. The API's own
        # Idempotency-Key mechanism decides what is safe to repeat; nginx cannot know, and a
        # blind retry of a POST /transfers is exactly the double-spend this project prevents.
        proxy_next_upstream off;
    }

    location = /healthz {
        set $api_backend "api:3000";
        proxy_pass http://$api_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        access_log off;
    }
}
