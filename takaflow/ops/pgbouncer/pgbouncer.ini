;; PgBouncer — transaction pooling.
;;
;; At 10M users the API tier scales horizontally, and every replica wants its own pool. Postgres
;; allocates a backend process per connection, so N replicas x 20 connections quickly exceeds what
;; the server can hold. PgBouncer multiplexes many short-lived client connections onto a small set
;; of server connections, handing one out only for the duration of a transaction.
;;
;; Transaction mode is what makes that possible, and it is also what constrains us: session state
;; (prepared statements, SET, LISTEN, advisory locks held across statements) does not survive
;; between transactions. This codebase already fits, deliberately:
;;   - every statement is sent with inline parameters, not server-side prepared statements
;;   - timeouts are set with SET LOCAL inside the transaction, never SET at session level
;;   - the only advisory lock (migrations) runs on a direct connection, bypassing PgBouncer

[databases]
takaflow = host=db port=5432 dbname=takaflow
takaflow_replica = host=db-replica port=5432 dbname=takaflow

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

pool_mode = transaction

;; The server-side pool is deliberately far smaller than the client-side one: this is the whole
;; point. Hundreds of API connections funnel into a few dozen Postgres backends.
max_client_conn = 2000
default_pool_size = 25
min_pool_size = 5
reserve_pool_size = 5
reserve_pool_timeout = 3

;; Fail fast rather than queue forever — the API turns this into a retryable 503, and every
;; money-moving endpoint is idempotent, so the client can safely try again.
query_wait_timeout = 5
server_login_retry = 1

ignore_startup_parameters = extra_float_digits,options

log_connections = 0
log_disconnections = 0
stats_period = 60
