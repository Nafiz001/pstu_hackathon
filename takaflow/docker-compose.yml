# TakaFlow — local topology.
#
# Profiles keep the day-to-day loop fast while declaring the full target topology in one file:
#
#   docker compose up -d                      db + redis            (phases 1-3: `npm run dev` on the host)
#   docker compose --profile scale up -d      + replica, pgbouncer, 3 API replicas, nginx  (phase 4)
#
# Everything a judge needs is one command; nothing unnecessary runs while iterating.

name: takaflow

x-postgres-env: &postgres-env
  POSTGRES_USER: takaflow
  POSTGRES_PASSWORD: takaflow
  POSTGRES_DB: takaflow

x-api-env: &api-env
  NODE_ENV: production
  PORT: "3000"
  JWT_SECRET: dev-secret-change-me
  RUN_MIGRATIONS_ON_BOOT: "true"
  REDIS_URL: redis://redis:6379
  # Operator endpoints fail closed without this. A demo value, and it is not pretending otherwise.
  ADMIN_API_TOKEN: local-operator-token-change-me

services:
  db:
    image: postgres:18-alpine
    container_name: takaflow-db
    environment:
      <<: *postgres-env
      POSTGRES_INITDB_ARGS: "--data-checksums"
    command:
      - postgres
      - -c
      - synchronous_commit=on          # durability is the point; never traded for benchmarks
      - -c
      - max_connections=300
      - -c
      - wal_level=replica
      - -c
      - max_wal_senders=10
      - -c
      - max_replication_slots=10
      - -c
      - hot_standby=on
      - -c
      - log_min_duration_statement=500
      - -c
      - deadlock_timeout=200ms
    ports:
      - "5433:5432"
    volumes:
      # Postgres 18+ images store data in a major-version subdirectory, so the mount goes one
      # level up at /var/lib/postgresql (mounting /data directly makes the image refuse to boot).
      - db-data:/var/lib/postgresql
      - ./ops/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U takaflow -d takaflow"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: takaflow-redis
    command: ["redis-server", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  # --- phase 4: scale topology ---------------------------------------------

  db-replica:
    profiles: ["scale"]
    image: postgres:18-alpine
    container_name: takaflow-db-replica
    environment:
      <<: *postgres-env
      PGUSER: takaflow
    entrypoint: ["/bin/sh", "/setup-replica.sh"]
    command:
      # A hot standby refuses to start unless these are at least as large as on the primary.
      - -c
      - max_connections=300
      - -c
      - hot_standby=on
      - -c
      - hot_standby_feedback=on      # let the primary hold back vacuum for in-flight replica reads
    volumes:
      - replica-data:/var/lib/postgresql
      - ./ops/replica/setup-replica.sh:/setup-replica.sh:ro
    ports:
      - "5434:5432"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U takaflow -d takaflow"]
      interval: 5s
      timeout: 3s
      retries: 30

  pgbouncer:
    profiles: ["scale"]
    image: edoburu/pgbouncer:latest
    container_name: takaflow-pgbouncer
    environment:
      DB_USER: takaflow
      DB_PASSWORD: takaflow
      DB_HOST: db
      DB_NAME: takaflow
      POOL_MODE: transaction
      MAX_CLIENT_CONN: "2000"
      DEFAULT_POOL_SIZE: "25"
      AUTH_TYPE: scram-sha-256
      # The image listens on 5432 unless told otherwise; 6432 keeps it unmistakable in logs and
      # in connection strings which hop is which.
      LISTEN_PORT: "6432"
    ports:
      - "6432:6432"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 6432 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Sits transparently between the API and its dependencies with NO toxics configured, so it has
  # no effect until a chaos test adds one. Injecting latency or severing a link then needs no
  # restart and no reconfiguration of the application — which is the point: the system under
  # test is the same system that ran the clean benchmark a moment earlier.
  toxiproxy:
    profiles: ["scale"]
    image: ghcr.io/shopify/toxiproxy:2.12.0
    container_name: takaflow-toxiproxy
    command: ["-host=0.0.0.0", "-config=/config/toxiproxy.json"]
    volumes:
      - ./ops/toxiproxy/toxiproxy.json:/config/toxiproxy.json:ro
    ports:
      - "8474:8474"   # control API, used by scripts/chaos.mjs
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ONE service, three replicas — not three hand-named services.
  #
  # Docker's DNS then returns three A records for `api`, which is what lets the proxy re-resolve
  # and rebalance when a replica is replaced. Each container identifies itself by hostname, so
  # logs and /healthz still say which one served a request.
  api:
    profiles: ["scale"]
    build:
      context: ./backend
    # A crash on an unknown-state error should self-heal rather than leaving a hole in the
    # rotation. Restart-on-failure is part of the design, not a workaround for one.
    restart: unless-stopped
    deploy:
      replicas: 3
    environment:
      <<: *api-env
      # Writes go to the primary via Toxiproxy -> PgBouncer; reads may be routed to the replica.
      DATABASE_URL: postgres://takaflow:takaflow@toxiproxy:5432/takaflow
      REPLICA_DATABASE_URL: postgres://takaflow:takaflow@db-replica:5432/takaflow
      REDIS_URL: redis://toxiproxy:6379
    depends_on:
      toxiproxy:
        condition: service_started
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy

  proxy:
    profiles: ["scale"]
    image: nginx:alpine
    container_name: takaflow-proxy
    volumes:
      - ./ops/proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "18090:80"   # high port: 8080/8081 are commonly taken or reserved on dev machines
    depends_on:
      - api

  # The application itself: the built SPA, served next to the API on one origin.
  web:
    profiles: ["scale"]
    build:
      context: ./frontend
    container_name: takaflow-web
    ports:
      - "18080:80"
    depends_on:
      - proxy

  # --- phase 5: observability and load ---------------------------------------

  prometheus:
    profiles: ["obs"]
    image: prom/prometheus:v3.1.0
    container_name: takaflow-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=6h
      - --web.enable-lifecycle
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./ops/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports:
      - "9090:9090"

  grafana:
    profiles: ["obs"]
    image: grafana/grafana:11.4.0
    container_name: takaflow-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: takaflow
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_DEFAULT_THEME: light
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3001:3000"
    depends_on:
      - prometheus

  k6:
    profiles: ["load"]
    image: grafana/k6:latest
    container_name: takaflow-k6
    volumes:
      - ./ops/k6:/scripts:ro
    environment:
      BASE_URL: http://proxy:80
      PROFILE: ${PROFILE:-steady}
    # Started explicitly with `run`, never as part of `up`.
    entrypoint: ["k6"]

volumes:
  db-data:
  replica-data:
